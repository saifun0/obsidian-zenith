<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 512 512" role="img" aria-labelledby="zenith-logo-title">
  <title id="zenith-logo-title">Zenith</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090a1f"/>
      <stop offset=".3" stop-color="#17134a"/>
      <stop offset=".55" stop-color="#3d2377"/>
      <stop offset=".74" stop-color="#7e3a8d"/>
      <stop offset=".88" stop-color="#cf6079"/>
      <stop offset="1" stop-color="#ffb783"/>
    </linearGradient>
    <radialGradient id="dawn" cx=".6" cy="1.02" r=".62">
      <stop offset="0" stop-color="#ffd9a6" stop-opacity=".95"/>
      <stop offset=".3" stop-color="#ff9a72" stop-opacity=".5"/>
      <stop offset=".65" stop-color="#b9539a" stop-opacity=".14"/>
      <stop offset="1" stop-color="#5a2f9a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset=".25" stop-color="#e9e3ff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#cfc4ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <!-- The sky a while before sunrise, as on the dashboard in the screenshots. -->
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <rect width="512" height="512" fill="url(#dawn)"/>
    <g fill="#fff">
      <circle cx="74" cy="92" r="2.2" opacity=".7"/><circle cx="132" cy="48" r="1.6" opacity=".55"/>
      <circle cx="402" cy="70" r="2" opacity=".65"/><circle cx="452" cy="148" r="1.5" opacity=".5"/>
      <circle cx="58" cy="206" r="1.5" opacity=".45"/><circle cx="346" cy="38" r="1.3" opacity=".5"/>
      <circle cx="470" cy="248" r="1.3" opacity=".35"/><circle cx="196" cy="84" r="1.2" opacity=".4"/>
      <circle cx="36" cy="300" r="1.2" opacity=".3"/><circle cx="426" cy="226" r="1" opacity=".3"/>
    </g>
    <path d="M0 438c70-26 132-30 196-12s118 22 174 4 96-22 142-10v92H0z" fill="#3a2167" opacity=".9"/>
    <path d="M0 468c84-24 150-20 222-4s132 14 290-16v64H0z" fill="#190f38"/>
  </g>
  <!-- The mark, on the 24-unit grid the ribbon icon is drawn on (src/core/brandIcon.ts): the same three shapes. -->
  <g transform="translate(88 82) scale(14)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#150a35" stroke-opacity=".1" stroke-width="3.2">
      <path d="M8.74 2.54A10 10 0 1 0 15.26 2.54"/>
      <path d="M8.5 8.5h7l-7 7h7"/>
    </g>
    <circle cx="12" cy="2.2" r="4.4" fill="url(#glow)" stroke="none"/>
    <g stroke="#fff" stroke-width="2">
      <path d="M8.74 2.54A10 10 0 1 0 15.26 2.54"/>
      <path d="M8.5 8.5h7l-7 7h7"/>
    </g>
    <circle cx="12" cy="2.2" r="1.4" fill="#fff" stroke="none"/>
  </g>
  <rect x=".75" y=".75" width="510.5" height="510.5" rx="115.25" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="1.5"/>
</svg>
