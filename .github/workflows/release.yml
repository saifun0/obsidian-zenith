# Publishes a release from main, when asked to and never on its own.
#
# Run it from the Actions tab (or the API) once the version bump is on main.
# It checks that the version asked for is the one in manifest.json, runs the
# types and the tests, builds, and publishes the same set of files a release
# has always had:
#
#   main.js, manifest.json, styles.css   what Obsidian downloads
#   zenith-<version>.zip                 the plugin folder, to unzip into plugins/
#   zenith-demo-vault-<version>.zip      the demo vault with this build in it
#
# The demo vault is built from `demo-vault/` in the repository, its dates moved
# forward to the day of the release (scripts/demo-vault.mjs). To change the
# vault, change it there.
#
# The three files Obsidian downloads are attested: anyone can check they were
# built here, from this commit, with `gh attestation verify`.

name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to release, exactly as in manifest.json (e.g. 0.2.12)'
                required: true
            notes:
                description: 'Release notes, in Markdown'
                required: true

permissions:
    contents: write
    # For the attestation: a signing identity, and leave to store what it signs.
    id-token: write
    attestations: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        # A named image, not ubuntu-latest: the system a release is built on
        # changes when this line does, and not before. ci.yml names the same.
        runs-on: ubuntu-24.04
        env:
            VERSION: ${{ inputs.version }}
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: The version asked for is the one being built
              run: |
                  node -e '
                    const v = process.env.VERSION;
                    const manifest = require("./manifest.json");
                    const versions = require("./versions.json");
                    if (manifest.version !== v) throw new Error(`manifest.json is at ${manifest.version}, not ${v}`);
                    if (require("./package.json").version !== v) throw new Error(`package.json is not at ${v}`);
                    if (!(v in versions)) throw new Error(`versions.json has no entry for ${v}`);
                  '
                  if gh release view "$VERSION" >/dev/null 2>&1; then
                      echo "A release $VERSION already exists." >&2
                      exit 1
                  fi

            - run: npm ci

            - name: Types and tests
              run: |
                  npx tsc --noEmit
                  npm test

            - name: Build
              run: node esbuild.config.mjs production

            - name: Package the plugin folder
              run: |
                  mkdir -p out/zenith
                  cp dist/main.js dist/manifest.json dist/styles.css out/zenith/
                  (cd out && zip -q -r -X -D "../zenith-$VERSION.zip" zenith)

            - name: Build the demo vault, with this build in it
              run: |
                  node scripts/demo-vault.mjs --out demo --build dist
                  # Packed by Python rather than `zip`: it marks the names as UTF-8, so the
                  # Russian start note keeps its name wherever the archive is opened. The
                  # vault was once carried from release to release through unzip and zip,
                  # and came out of that with the note renamed to mojibake.
                  python3 - "$VERSION" <<'PY'
                  import os, sys, zipfile

                  out = f"zenith-demo-vault-{sys.argv[1]}.zip"
                  with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
                      for folder, folders, names in os.walk("demo/zenith-demo-vault"):
                          folders.sort()
                          for name in sorted(names):
                              path = os.path.join(folder, name)
                              archive.write(path, os.path.relpath(path, "demo"))

                  names = zipfile.ZipFile(out).namelist()
                  for wanted in (
                      "zenith-demo-vault/Start here.md",
                      "zenith-demo-vault/Начните здесь.md",
                      "zenith-demo-vault/.obsidian/plugins/zenith/main.js",
                      "zenith-demo-vault/.obsidian/plugins/zenith/data.json",
                  ):
                      assert wanted in names, f"the demo vault has no {wanted}"
                  print(out, len(names), "files")
                  PY

            - name: Attest where the plugin's files were built
              uses: actions/attest-build-provenance@v4
              with:
                  subject-path: |
                      dist/main.js
                      dist/manifest.json
                      dist/styles.css

            - name: Publish
              env:
                  NOTES: ${{ inputs.notes }}
              run: |
                  printf '%s\n' "$NOTES" > notes.md
                  gh release create "$VERSION" \
                      --target "$GITHUB_SHA" \
                      --title "Zenith $VERSION" \
                      --notes-file notes.md \
                      dist/main.js dist/manifest.json dist/styles.css \
                      "zenith-$VERSION.zip" "zenith-demo-vault-$VERSION.zip"
